#
# The IceGrid instance name.
#
IceGrid.InstanceName=ThreeLivesRealm

#
# The IceGrid locator proxy.
#
Ice.Default.Locator=ThreeLivesRealm/Locator:default -h 127.0.0.1 -p 14061

#
# IceGrid registry configuration.
#
IceGrid.Registry.Client.Endpoints=default -h 127.0.0.1 -p 14061
IceGrid.Registry.Server.Endpoints=default -h 127.0.0.1
IceGrid.Registry.Internal.Endpoints=default -h 127.0.0.1

#
# Enable the admin session manager for use with Glacier2.
#
IceGrid.Registry.AdminSessionManager.Endpoints=default -h 127.0.0.1

IceGrid.Registry.LMDB.Path=ice_db/registry
IceGrid.Registry.PermissionsVerifier=ThreeLivesRealm/NullPermissionsVerifier
IceGrid.Registry.AdminPermissionsVerifier=ThreeLivesRealm/NullPermissionsVerifier
IceGrid.Registry.SSLPermissionsVerifier=ThreeLivesRealm/NullSSLPermissionsVerifier
IceGrid.Registry.AdminSSLPermissionsVerifier=ThreeLivesRealm/NullSSLPermissionsVerifier
IceGrid.Registry.Discovery.Interface=127.0.0.1

#
# IceGrid node configuration.
#
IceGrid.Node.Name=node_01
IceGrid.Node.Endpoints=default -h 127.0.0.1
IceGrid.Node.Data=ice_db/node_01
IceGrid.Node.CollocateRegistry=1
#IceGrid.Node.Output=db
#IceGrid.Node.RedirectErrToOut=1

#
# IceMX configuration
#
IceMX.Metrics.Debug.GroupBy=id
IceMX.Metrics.Debug.Disabled=1
IceMX.Metrics.Debug.Reject.parent=Ice\.Admin
IceMX.Metrics.ByParent.GroupBy=parent
IceMX.Metrics.ByParent.Disabled=1

#
# Trace properties.
#
IceGrid.Node.Trace.Activator=1
#IceGrid.Node.Trace.Adapter=2
#IceGrid.Node.Trace.Server=3

#
# Dummy username and password for icegridadmin.
#
IceGridAdmin.Username=foo
IceGridAdmin.Password=bar
