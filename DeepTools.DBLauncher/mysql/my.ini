[client]
# 设置mysql客户端默认字符集
default-character-set=utf8

[mysqld]
# 设置3306端口,有多个服务，为了不冲突修改默认的3306端口为3307
port=3306
# 设置mysql的安装目录
basedir=..
# 设置 mysql数据库存放目录
datadir=..\\data
# 允许最大连接数
max_connections=2000
# 服务端使用的字符集默认为8比特编码的latin1字符集
character-set-server=utf8
# 创建新表时将使用的默认存储引擎
default-storage-engine=INNODB